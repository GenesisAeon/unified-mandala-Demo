name: Demo Smokes
on: [push, pull_request]
jobs:
  smokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm i
      - run: pnpm build || true
      - run: |
          pnpm start &
          npx wait-on http://localhost:3000/healthz -t 30000
      - run: pnpm smoke
