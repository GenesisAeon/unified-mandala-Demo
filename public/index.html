<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UnifiedMandala Lite</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    :root { --bg:#0b0d10; --card:#151a21; --fg:#e9eef5; --muted:#9db0c5; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--fg); margin: 0; padding: 24px; }
    h1 { margin: 0 0 8px 0; font-size: 22px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .kpi { display:flex; align-items:center; justify-content:space-between; }
    .muted { color: var(--muted); font-size: 12px; }
    .badge { font-size: 20px; }
    .sigil { font-size: 24px; }
    .ok { color: #5cff96; } .warn { color:#ffd36b; } .alarm { color:#ff6b6b; }
    footer { margin-top: 16px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>🌀 UnifiedMandala Lite</h1>
  <div id="crep" class="card"></div>
  <div id="kpis" class="grid"></div>
  <section id="hydro-tile" class="tile">
    <h2>Hydro-Resilience (HVI/BLR/Tele)</h2>
    <div id="hydro-kpis" class="kpi-grid"></div>
  </section>
  <section class="tile">
    <h2>Sigillin Gallery</h2>
    <a href="/gallery/index.html">öffnen →</a>
  </section>
  <footer>
    <span id="status" class="muted"></span>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/hydro.js"></script>
</body>
</html>
